<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solar System Signal Delay Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app-container">
    <canvas id="solarCanvas"></canvas>

    <div id="control-panel">
      <h1>🌌 Solar System Signal Delay Simulator</h1>
      
      <div class="selectors">
        <label>Source Planet:</label>
        <select id="sourceSelect"></select>

        <label>Destination Planet:</label>
        <select id="destinationSelect"></select>

        <button id="sendSignalBtn">Send Signal</button>
      </div>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="resetBtn">Reset</button>
        <label>Speed:</label>
        <input type="range" id="speedSlider" min="0.1" max="10" step="0.1" value="1">
      </div>

      <div id="console">
        <h2>Communication Console</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
